version: '3.8'

# Docker Compose file for EC2 deployment
# This file pulls pre-built images from Docker Hub

services:
  backend:
    image: fayivor/exam-prep-backend:latest
    container_name: exam-assistant-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./exam_assistant.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_MODEL=claude-3-5-sonnet-20241022
      - APP_NAME=University Exam Assistant
      - APP_VERSION=1.0.0
      - UPLOAD_DIR=./uploads
      - CORS_ORIGINS=http://YOUR_EC2_IP,http://YOUR_EC2_IP:80
    volumes:
      - backend-data:/app/uploads
      - backend-db:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: fayivor/exam-prep-frontend:latest
    container_name: exam-assistant-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  backend-data:
  backend-db:
